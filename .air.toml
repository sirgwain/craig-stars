root = "."
tmp_dir = "tmp"

[build]
  args_bin = ["--log", "tmp/logfile.log", "serve"]
  bin = "./dist/craig-stars"
  cmd = "mage build_server"
  delay = 1000
  exclude_dir = ["dist", "frontend", "vendor", "tmp", "data"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "tpl", "tmpl"]
  kill_delay = ".5s"
  log = "tmp/build-errors.log"
  send_interrupt = true
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
