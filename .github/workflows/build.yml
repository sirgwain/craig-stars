# Workflow to build & test on each commit or PR to develop
name: Build
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - "develop"

  push:
    branches:
      - "develop"

  workflow_dispatch: # allow manually triggering on drafts if need be

env:
  go-version: 1.24.x

jobs:
  test_backend:
    # don't run job on draft PRs unless manually triggered
    if: ${{ github.event_name != 'pull-request' || github.event.pull_request.draft == 'false' }}
    name: Run backend Go tests
    strategy:
      matrix:
        os: [ubuntu-latest] # no need for multiple OSes if we're just running go tests
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      # build & test
      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.go-version }}
          check-latest: true
          cache: true

      - name: Setup Mage
        uses: magefile/mage-action@v3
        with:
          install-only: true

      - name: Test Go Files
        id: go-tests
        run: mage test_golang "./..."

      - name: Upload gotestsum reports
        uses: actions/upload-artifact@v4
        with:
          name: gotestsum-report
          path: |
            tmp/diff.jsonl
            tmp/test-results/*
          overwrite: true
          retention-days: 7
        if: ${{steps.go-tests.outcome}} == 'failure'

      - name: Produce Test Summary
        uses: test-summary/action@v2
        with:
          paths: "tmp/**/*_report.xml"
        if: always()

  build:
    name: Build app and test frontend
    if: ${{ github.event_name != 'pull-request' || github.event.pull_request.draft == 'false' }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      # build the backend (fast)
      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.go-version }}
          check-latest: true
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node.js dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Setup Mage
        uses: magefile/mage-action@v3
        with:
          install-only: true

      - name: Perform mage setup tasks (generate, images, copy_wasm)
        run: mage generate images copy_wasm_exec

      - name: Build Backend Go Binary
        run: CGO_ENABLED=1 GOARCH=amd64 GOOS=linux mage build_backend

        # build the frontend (slow)
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
        working-directory: ./frontend

      - name: Run Playwright tests
        run: npx playwright test
        working-directory: ./frontend
        id: playwright-test

      - name: Upload Playwright reports
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tmp/test-results/playwright-report
          overwrite: true
          retention-days: 7
        if: ${{steps.playwright-test.outcome}} == 'failure'

      - name: Run Vitest tests
        run: npx vitest --run
        working-directory: ./frontend
        id: vitest-test

      - name: Upload Vitest report
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report
          path: tmp/test-results/vitest-report.xml
          overwrite: true
          retention-days: 7
        if: ${{steps.vitest-test.outcome}} == 'failure'

      - name: Build Frontend Binary
        run: npm run build
        working-directory: ./frontend

      - name: Produce Test Summary
        uses: test-summary/action@v2
        with:
          paths: "tmp/**/*_report.xml"
        if: always()
