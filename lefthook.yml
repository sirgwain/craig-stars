# lefthook.yml

assert.lefthook.installed: true
pre-commit:
  parallel: true
  commands:
    gofmt:
      glob: "*.go"
      exclude:
        - "**/generated.go"
      run: gofmt -l -w {staged_files}
      stage_fixed: true
    prettier_backend:
      exclude:
        - frontend/**
      run: npx prettier --ignore-unknown --write {staged_files}
      stage_fixed: true
    prettier_frontend:
      root: "frontend/"
      run: npx prettier --ignore-unknown --write {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  skip:
    - merge-commit
    - rebase
  commands:
    generate:
      run: mage generate
    tidy:
      run: mage tidy
