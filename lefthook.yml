# lefthook.yml

assert.lefthook.installed: true
pre-commit:
  skip:
    - merge
    - rebase
  commands:
    gofmt:
      glob: "*.go"
      exclude:
        - "**/generated.go"
      files: git diff --cached --name-only --diff-filter=ACMR # don't lint deleted/untracked files
      run: gofmt -l -w {files}
      stage_fixed: true
    prettier_backend:
      exclude:
        - "frontend/**"
        - "*.go"
      files: git diff --cached --name-only --diff-filter=ACMR
      # use frontend config to avoid using default config and backend indentation
      run: npx prettier --ignore-unknown --write {files} --config=./frontend/.prettierrc
      stage_fixed: true
    prettier_frontend:
      root: "frontend/"
      exclude:
        - "frontend/src/lib/ssr/**"
      files: git diff --relative --cached --name-only --diff-filter=ACMR
      run: npx prettier --ignore-unknown --write {files}
      stage_fixed: true
