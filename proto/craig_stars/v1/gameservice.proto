syntax = "proto3";

package craig_stars.v1;

import "craig_stars/v1/common.proto";
import "craig_stars/v1/game.proto";
import "craig_stars/v1/race.proto";
import "google/protobuf/field_mask.proto";

service GameService {
  rpc AddPlayer(AddPlayerRequest) returns (AddPlayerResponse);
  rpc ArchiveGame(ArchiveGameRequest) returns (ArchiveGameResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  rpc CreateGame(CreateGameRequest) returns (CreateGameResponse);
  rpc DeleteGame(DeleteGameRequest) returns (DeleteGameResponse);
  rpc DeletePlayerSlot(DeletePlayerSlotRequest) returns (DeletePlayerSlotResponse);
  rpc ForceGenerateTurn(ForceGenerateTurnRequest) returns (ForceGenerateTurnResponse);
  rpc GetGame(GetGameRequest) returns (GetGameResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc GetGameByInviteHash(GetGameByInviteHashRequest) returns (GetGameByInviteHashResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc GetGames(GetGamesRequest) returns (GetGamesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc GetGuestUser(GetGuestUserRequest) returns (GetGuestUserResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc JoinGame(JoinGameRequest) returns (JoinGameResponse);
  rpc KickPlayer(KickPlayerRequest) returns (KickPlayerResponse);
  rpc LeaveGame(LeaveGameRequest) returns (LeaveGameResponse);
  rpc StartGame(StartGameRequest) returns (StartGameResponse);
  rpc UnarchiveGame(UnarchiveGameRequest) returns (UnarchiveGameResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Update setup settings, or selected settings in a running single-player game.
  // Only the host may update a game. Running games must be waiting for players.
  rpc UpdateGame(UpdateGameRequest) returns (UpdateGameResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

message AddPlayerRequest {
  int64 game_id = 1;
  PlayerType player_type = 2;
}

message AddPlayerResponse {
  GameWithPlayers game = 1;
}

message ArchiveGameRequest {
  int64 game_id = 1;
}

message ArchiveGameResponse {
  GameWithPlayers game = 1;
}

message CreateGameRequest {
  GameSettings settings = 1;
}

message CreateGameResponse {
  GameWithPlayers game = 1;
}

message DeleteGameRequest {
  int64 game_id = 1;
}

message DeleteGameResponse {}

message DeletePlayerSlotRequest {
  int64 game_id = 1;
  int32 player_num = 2;
}

message DeletePlayerSlotResponse {
  GameWithPlayers game = 1;
}

message ForceGenerateTurnRequest {
  int64 game_id = 1;
}
message ForceGenerateTurnResponse {
  GameWithPlayers game = 1;
}

message GetGameByInviteHashRequest {
  string hash = 1;
}

message GetGameByInviteHashResponse {
  GameWithPlayers game = 1;
}

message GetGameRequest {
  int64 game_id = 1;
}

message GetGameResponse {
  GameWithPlayers game = 1;
}

message GetGamesRequest {
  bool open = 2;
}

message GetGamesResponse {
  repeated GameWithPlayers games = 1;
}

message GetGuestUserRequest {
  int64 game_id = 1;
  int32 player_num = 2;
}

message GetGuestUserResponse {
  GuestUser user = 1;
}

message GuestUser {
  int64 id = 1;
  string username = 2;
  string hash = 3;
  int64 game_id = 4;
  int32 player_num = 5;
}

message JoinGameRequest {
  int64 game_id = 1;
  Race race = 2;
  string name = 3;
}

message JoinGameResponse {}

message KickPlayerRequest {
  int64 game_id = 1;
  int32 player_num = 2;
}

message KickPlayerResponse {
  GameWithPlayers game = 1;
}

message LeaveGameRequest {
  int64 game_id = 1;
}

message LeaveGameResponse {}

message StartGameRequest {
  int64 game_id = 1;
}

message StartGameResponse {}

message UnarchiveGameRequest {
  int64 game_id = 1;
}

message UnarchiveGameResponse {
  GameWithPlayers game = 1;
}

message UpdateGameRequest {
  int64 game_id = 1;
  GameSettings settings = 2;
  // Top-level GameSettings fields to replace, including explicit false/zero values.
  // Omit during setup to retain the existing full-settings replacement behavior.
  // Required after setup; only name, public_player_scores, random_events, and
  // victory_conditions are editable in single-player games. Victory conditions
  // cannot change after a victor is declared. Replace victory_conditions as a
  // whole message; nested paths, players, and wildcard paths are not supported.
  google.protobuf.FieldMask update_mask = 3;
}

message UpdateGameResponse {
  GameWithPlayers game = 1;
}
