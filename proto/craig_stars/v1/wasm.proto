syntax = "proto3";

package craig_stars.v1;

import "craig_stars/v1/common.proto";
import "craig_stars/v1/battle.proto";
import "craig_stars/v1/fleet.proto";
import "craig_stars/v1/fleetservice.proto";
import "craig_stars/v1/minefield.proto";
import "craig_stars/v1/planet.proto";
import "craig_stars/v1/player.proto";
import "craig_stars/v1/race.proto";
import "craig_stars/v1/shipdesign.proto";
import "craig_stars/v1/tech.proto";

service WasmService {
  rpc SimulateBattle(SimulateBattleRequest) returns (SimulateBattleResponse) {}
  rpc AddWaypoint(AddWaypointRequest) returns (AddWaypointResponse) {}
  rpc CalculateRacePoints(CalculateRacePointsRequest) returns (CalculateRacePointsResponse) {}
  rpc ComputeMinefieldSpec(ComputeMinefieldSpecRequest) returns (ComputeMinefieldSpecResponse) {}
  rpc ComputePlayerResearchSpec(ComputePlayerResearchSpecRequest) returns (ComputePlayerResearchSpecResponse) {}
  rpc ComputeRaceSpec(ComputeRaceSpecRequest) returns (ComputeRaceSpecResponse) {}
  rpc ComputeShipDesignSpec(ComputeShipDesignSpecRequest) returns (ComputeShipDesignSpecResponse) {}
  rpc EnableDebug(EnableDebugRequest) returns (EnableDebugResponse) {}
  rpc EstimateProduction(EstimateProductionRequest) returns (EstimateProductionResponse) {}
  rpc GetMaxBuildable(GetMaxBuildableRequest) returns (GetMaxBuildableResponse) {}
  rpc GetPlanetHabitability(GetPlanetHabitabilityRequest) returns (GetPlanetHabitabilityResponse) {}
  rpc GetResearchCost(GetResearchCostRequest) returns (GetResearchCostResponse) {}
  rpc GetStarbaseUpgradeCost(GetStarbaseUpgradeCostRequest) returns (GetStarbaseUpgradeCostResponse) {}
  rpc GetTechCost(GetTechCostRequest) returns (GetTechCostResponse) {}
  rpc SetDesigns(SetDesignsRequest) returns (SetDesignsResponse) {}
  rpc SetIntels(SetIntelsRequest) returns (SetIntelsResponse) {}
  rpc SetPlayer(SetPlayerRequest) returns (SetPlayerResponse) {}
  rpc UpdatePlanet(UpdatePlanetRequest) returns (UpdatePlanetResponse) {}
  rpc UpdatePlanets(UpdatePlanetsRequest) returns (UpdatePlanetsResponse) {}
  rpc UpdateWaypoint(UpdateWaypointRequest) returns (UpdateWaypointResponse) {}
  rpc UpdateWaypointSpeed(UpdateWaypointSpeedRequest) returns (UpdateWaypointSpeedResponse) {}
}

message AddWaypointRequest {
  Fleet fleet = 1;
  WaypointDest dest = 2;
  int32 current_selected_waypoint_index = 3;
  bool fastest_waypoint = 4;
}

message AddWaypointResponse {
  Fleet fleet = 1;
  int32 index = 2;
}

message CalculateRacePointsRequest {
  Race race = 1;
}

message CalculateRacePointsResponse {
  int32 points = 1;
}

message ComputeMinefieldSpecRequest {
  Minefield minefield = 1;
}

message ComputeMinefieldSpecResponse {
  MinefieldSpec spec = 1;
}

message ComputePlayerResearchSpecRequest {
}

message ComputePlayerResearchSpecResponse {
  PlayerResearchSpec spec = 1;
}

message ComputeRaceSpecRequest {
  Race race = 1;
}

message ComputeRaceSpecResponse {
  RaceSpec spec = 1;
}

message ComputeShipDesignSpecRequest {
  ShipDesign design = 1;
  // Optional independent owner for simulator design previews.
  Player player = 2;
  bool validate = 3;
}

message ComputeShipDesignSpecResponse {
  ShipDesignSpec spec = 1;
}

message EnableDebugRequest {
  bool debug = 1;
}

message EnableDebugResponse {}

message EstimateProductionRequest {
  Planet planet = 1;
}

message EstimateProductionResponse {
  Planet planet = 1;
}

message GetMaxBuildableRequest {
  Planet planet = 1;
  QueueItemType item_type = 2;
}

message GetMaxBuildableResponse {
  int32 result = 1;
}

message GetPlanetHabitabilityRequest {
  Race race = 1;
  Hab hab = 2;
}

message GetPlanetHabitabilityResponse {
  int32 result = 1;
}

message GetResearchCostRequest {
  TechLevel tech_level = 1;
}

message GetResearchCostResponse {
  int32 resources = 1;
}

message GetStarbaseUpgradeCostRequest {
  ShipDesign design = 1;
  ShipDesign new_design = 2;
}

message GetStarbaseUpgradeCostResponse {
  Cost cost = 1;
}

message GetTechCostRequest {
  Tech tech = 1;
  Player player = 2;
}

message GetTechCostResponse {
  Cost cost = 1;
}

message SetDesignsRequest {
  repeated ShipDesign designs = 1;
}

message SetDesignsResponse {}

message SetIntelsRequest {
  Intels intels = 1;
}

message SetIntelsResponse {}

message SetPlayerRequest {
  Player player = 1;
}

message SetPlayerResponse {}

message UpdatePlanetRequest {
  Planet planet = 1;
}

message UpdatePlanetResponse {}

message UpdatePlanetsRequest {
  repeated Planet planets = 1;
}

message UpdatePlanetsResponse {}

message UpdateWaypointRequest {
  Fleet fleet = 1;
  WaypointDest dest = 2;
  int32 current_selected_waypoint_index = 3;
  bool fastest_waypoint = 4;
}

message UpdateWaypointResponse {
  Fleet fleet = 1;
  UpdateWaypointResult result = 3;
}

message UpdateWaypointSpeedRequest {
  Fleet fleet = 1;
  int32 waypoint_index = 2;
  int32 warp_speed = 3;
}

message UpdateWaypointSpeedResponse {
  Fleet fleet = 1;
}

// Each stack is an independent battle token with its own orders.
message BattleSimulationStack {
  ShipDesign design = 1;
  int32 quantity = 2;
  int32 quantity_damaged = 3;
  double damage = 4;
  BattlePlan plan = 5;
}
message BattleSimulationSide {
  Race race = 1;
  TechLevel tech_levels = 2;
  repeated BattleSimulationStack stacks = 3;
  map<string, bool> acquired_techs = 4;
}
message SimulateBattleRequest {
  repeated BattleSimulationSide sides = 1;
  int64 seed = 2;
}
message BattleSimulationStackResult {
  int32 player_num = 1;
  int32 design_num = 2;
  int32 survivors = 3;
  int32 retreated = 4;
  int32 destroyed = 5;
  Cost loss = 6;
}
message SimulateBattleResponse {
  BattleRecord record = 1;
  repeated ShipDesign designs = 2;
  repeated BattleSimulationStackResult stacks = 3;
}
