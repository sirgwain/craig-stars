syntax = "proto3";

package craig_stars.v1;

import "craig_stars/v1/common.proto";
import "craig_stars/v1/minefield.proto";
import "craig_stars/v1/race.proto";

// The basic skeleton of a Tech item, containing name, cost and other essential info.
message Tech {
  string name = 1;
  Cost cost = 2;
  TechRequirements requirements = 3;
  int32 ranking = 4;
  TechCategory category = 5;
  TechOrigin origin = 6;
  map<string, bool> tags = 7;
}

enum TechTag {
  TECH_TAG_UNSPECIFIED = 0;
  TECH_TAG_ARMOR = 1;
  TECH_TAG_BEAM_CAPACITOR = 2;
  TECH_TAG_BEAM_DEFLECTOR = 3;
  TECH_TAG_BEAM_WEAPON = 4;
  TECH_TAG_BOMB = 5;
  TECH_TAG_CAPITAL_SHIP_MISSILE = 6;
  TECH_TAG_CARGO_POD = 7;
  TECH_TAG_CLOAK = 8;
  TECH_TAG_COLONY_MODULE = 9;
  TECH_TAG_DEFENSE = 10;
  TECH_TAG_ENGINE = 11;
  TECH_TAG_FUEL_TANK = 12;
  TECH_TAG_GATLING_GUN = 13;
  TECH_TAG_HEAVY_MINE_LAYER = 14;
  TECH_TAG_INITIATIVE_BONUS = 15;
  TECH_TAG_MASS_DRIVER = 16;
  TECH_TAG_MANEUVERING_JET = 17;
  TECH_TAG_MINE_LAYER = 18;
  TECH_TAG_MINING_ROBOT = 19;
  TECH_TAG_PLANETARY_SCANNER = 20;
  TECH_TAG_RAM_SCOOP = 21;
  TECH_TAG_TERRAFORMING_ROBOT = 22;
  TECH_TAG_SCANNER = 23;
  TECH_TAG_SHIELD = 24;
  TECH_TAG_SHIELD_SAPPER = 25;
  TECH_TAG_SMART_BOMB = 26;
  TECH_TAG_SPEED_MINE_LAYER = 27;
  TECH_TAG_STARGATE = 28;
  TECH_TAG_STRUCTURE_BOMB = 29;
  TECH_TAG_TERRAFORMING = 30;
  TECH_TAG_TORPEDO = 31;
  TECH_TAG_TORPEDO_JAMMER = 32;
  TECH_TAG_TORPEDO_BONUS = 33;
}

// Tech categories
enum TechCategory {
  TECH_CATEGORY_UNSPECIFIED = 0;
  TECH_CATEGORY_ARMOR = 1;
  TECH_CATEGORY_BEAM_WEAPON = 2;
  TECH_CATEGORY_BOMB = 3;
  TECH_CATEGORY_ELECTRICAL = 4;
  TECH_CATEGORY_ENGINE = 5;
  TECH_CATEGORY_MECHANICAL = 6;
  TECH_CATEGORY_MINE_LAYER = 7;
  TECH_CATEGORY_MINE_ROBOT = 8;
  TECH_CATEGORY_ORBITAL = 9;
  TECH_CATEGORY_PLANETARY = 10;
  TECH_CATEGORY_PLANETARY_SCANNER = 11;
  TECH_CATEGORY_PLANETARY_DEFENSE = 12;
  TECH_CATEGORY_SCANNER = 13;
  TECH_CATEGORY_SHIELD = 14;
  TECH_CATEGORY_SHIP_HULL = 15;
  TECH_CATEGORY_STARBASE_HULL = 16;
  TECH_CATEGORY_TERRAFORMING = 17;
  TECH_CATEGORY_TORPEDO = 18;
}

// Tech origins
enum TechOrigin {
  TECH_ORIGIN_UNSPECIFIED = 0;
  TECH_ORIGIN_MYSTERY_TRADER = 1;
}

message TechRequirements {
  TechLevel tech_level = 1;
  repeated Prt prts_denied = 7;
  uint32 lrts_required = 8;
  uint32 lrts_denied = 9;
  repeated Prt prts_required = 10;
  repeated string hulls_allowed = 11;
  repeated string hulls_denied = 12;
  bool acquirable = 13;
}

message TechHullComponent {
  Tech tech = 1;
  uint32 hull_slot_type = 2;
  int32 mass = 3;
  bool scanner = 4;
  int32 scan_range = 5;
  int32 scan_range_pen = 6;
  int32 safe_hull_mass = 7;
  int32 safe_range = 8;
  int32 max_hull_mass = 9;
  int32 max_range = 10;
  bool radiating = 11;
  int32 packet_speed = 12;
  int32 cloak_units = 13;
  int32 terraform_rate = 14;
  int32 mining_rate = 15;
  double kill_rate = 16;
  int32 min_kill_rate = 17;
  double structure_destroy_rate = 18;
  int32 unterraform_rate = 19;
  bool smart = 20;
  bool can_steal_fleet_cargo = 21;
  bool can_steal_planet_cargo = 22;
  int32 armor = 23;
  int32 shield = 24;
  double torpedo_bonus = 25;
  int32 initiative_bonus = 26;
  double beam_bonus = 27;
  int32 reduce_movement = 28;
  double torpedo_jamming = 29;
  bool reduce_cloaking = 30;
  bool cloak_unarmed_only = 31;
  MinefieldType minefield_type = 32;
  int32 mine_laying_rate = 33;
  double beam_defense = 34;
  int32 cargo_bonus = 35;
  bool colonization_module = 36;
  int32 fuel_bonus = 37;
  int32 fuel_generation = 38;
  double movement_bonus = 39;
  bool orbital_construction_module = 40;
  int32 power = 41;
  int32 range = 42;
  int32 initiative = 43;
  bool gatling = 44;
  bool hits_all_targets = 45;
  bool damage_shields_only = 46;
  int32 accuracy = 47;
  bool capital_ship_missile = 48;
  bool can_jump = 49;
  // engine
  int32 ideal_speed = 56;
  int32 free_speed = 57;
  int32 max_safe_speed = 58;
  repeated int32 fuel_usage = 59;
}

message TechHull {
  Tech tech = 1;
  TechHullType type = 2;
  int32 mass = 3;
  int32 armor = 4;
  int32 shield = 5;
  int32 fuel_capacity = 6;
  int32 fuel_generation = 7;
  int32 cargo_capacity = 8;
  VectorFloat64 cargo_slot_position = 9;
  VectorFloat64 cargo_slot_size = 10;
  bool cargo_slot_circle = 11;
  int32 space_dock = 12;
  VectorFloat64 space_dock_slot_position = 13;
  VectorFloat64 space_dock_slot_size = 14;
  bool space_dock_slot_circle = 15;
  double mine_laying_bonus = 16;
  int32 initiative = 17;
  double repair_bonus = 18;
  bool immune_to_own_detonation = 19;
  int32 range_bonus = 20;
  bool starbase = 21;
  bool orbital_construction_hull = 22;
  bool built_in_scanner = 23;
  bool double_mine_efficiency = 24;
  int32 max_population = 25;
  double innate_scan_range_pen_factor = 26;
  repeated TechHullSlot slots = 27;
}

// Tech hull types
enum TechHullType {
  TECH_HULL_TYPE_UNSPECIFIED = 0;
  TECH_HULL_TYPE_BOMBER = 1;
  TECH_HULL_TYPE_COLONIZER = 2;
  TECH_HULL_TYPE_CAPITAL_SHIP = 3;
  TECH_HULL_TYPE_FIGHTER = 4;
  TECH_HULL_TYPE_FREIGHTER = 5;
  TECH_HULL_TYPE_FUEL_TRANSPORT = 6;
  TECH_HULL_TYPE_MINER = 7;
  TECH_HULL_TYPE_MINE_LAYER = 8;
  TECH_HULL_TYPE_MULTI_PURPOSE_FREIGHTER = 9;
  TECH_HULL_TYPE_ORBITAL_FORT = 10;
  TECH_HULL_TYPE_SCOUT = 11;
  TECH_HULL_TYPE_STARBASE = 12;
}

message TechHullSlot {
  uint32 type = 1;
  int32 capacity = 2;
  bool required = 3;
  VectorFloat64 position = 4;
}

message TechPlanetary {
  Tech tech = 1;
  bool reset_planet = 2;
}

message TechPlanetaryScanner {
  Tech tech = 1;
  int32 scan_range = 2;
  int32 scan_range_pen = 3;
}

message TechDefense {
  Tech tech = 1;
  double defense_coverage = 2;
}

message TechTerraform {
  Tech tech = 1;
  int32 ability = 2;
  TerraformHabType hab_type = 3;
}

// Terraform hab types
enum TerraformHabType {
  TERRAFORM_HAB_TYPE_UNSPECIFIED = 0;
  TERRAFORM_HAB_TYPE_GRAV = 1;
  TERRAFORM_HAB_TYPE_TEMP = 2;
  TERRAFORM_HAB_TYPE_RAD = 3;
  TERRAFORM_HAB_TYPE_ALL = 4;
}
message Engine {
  int32 ideal_speed = 1;
  int32 free_speed = 2;
  int32 max_safe_speed = 3;
  repeated int32 fuel_usage = 4;
}

message Bomb {
  int32 quantity = 1;
  double kill_rate = 2;
  int32 min_kill_rate = 3;
  double structure_destroy_rate = 4;
  int32 unterraform_rate = 5;
}
