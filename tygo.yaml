packages:
  - path: "github.com/sirgwain/craig-stars/cs"
    output_path: "./frontend/src/lib/types/cs.ts"
    indent: "\t"
    type_mappings:
      time.Time: "string /* RFC3339 */"
      math.MaxInt32: "2147483647 /* math.MaxInt32 */"
    fallback_type: "unknown"
    preserve_comments: "types"
    exclude_files:
      - "battle.go"
      - "battletoken.go"
      - "battleweapon.go"
      - "cache.go"
      - "cleanup.go"
      - "costcalculator.go"
      - "fleetmerge.go"
      - "fleetmover.go"
      - "gamer.go"
      - "invasion.go"
      - "math.go"
      - "names.go"
      - "productionestimator.go"
      - "rng.go"
      - "techtrader.go"
      - "turn.go"
